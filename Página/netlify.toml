# Configuración de deploy. Con este archivo en la raíz del repositorio,
# Netlify no pregunta nada al vincularlo: sabe que no hay que compilar
# y que los archivos a publicar están en la raíz.

[build]
  publish = "."
  command = ""

# Los archivos de configuración y datos no se cachean, así un cambio
# en config.js se ve enseguida sin tener que forzar la recarga.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cartilla.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El resto de los assets sí se cachean un año: no cambian casi nunca.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
